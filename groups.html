<!DOCTYPE html>
<!-- ROW group confirmation. VERSION 2026-08-18 C.
     This page no longer holds the form. The form is now served by the
     club's own script, so the page and the answer live at one address and
     nothing can block it. Every link ever sent still works, because this
     page passes whatever it was given straight through. -->
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ROW Swim Club — taking you to the form</title>
<style>
  body{margin:0;padding:28px 18px;background:#EDF3F5;color:#0B2C4A;font-size:17px;line-height:1.55;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:520px;margin:0 auto}
  .club{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#0F4C63;
        font-weight:700;margin:0 0 10px}
  .ver{float:right;font-weight:400;letter-spacing:0;text-transform:none;color:#B7C6CD;font-size:10px}
  .rope{height:12px;border-radius:6px;margin-bottom:24px;
        background:repeating-linear-gradient(90deg,#17B8C4 0 14px,#0B2C4A 14px 28px)}
  .card{background:#fff;border:1px solid #D5E0E5;border-radius:14px;padding:28px 24px}
  h1{font-size:24px;margin:0 0 8px;line-height:1.2}
  p{margin:0 0 16px;color:#5A7183}
  a.go{display:block;text-align:center;background:#0F4C63;color:#fff;text-decoration:none;
       border-radius:10px;padding:16px;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <p class="club">ROW Swim Club<span class="ver">v2026-08-18C</span></p>
  <div class="rope"></div>
  <div class="card">
    <h1>Taking you to the form</h1>
    <p>One moment. If nothing happens, use the button below.</p>
    <a class="go" id="go" href="https://script.google.com/macros/s/AKfycbzevpwNa2SoWSWbRq3UJvqgVPi_rPDKIyfIOpXcbSefw9gkK0FVFo3kKp6txV9P499vlQ/exec">Continue</a>
  </div>
</div>
<script>
(function(){
  var base = 'https://script.google.com/macros/s/AKfycbzevpwNa2SoWSWbRq3UJvqgVPi_rPDKIyfIOpXcbSefw9gkK0FVFo3kKp6txV9P499vlQ/exec';
  var q = window.location.search || '';
  var to = base + q;
  document.getElementById('go').setAttribute('href', to);
  window.location.replace(to);
})();
</script>
</body>
</html>
